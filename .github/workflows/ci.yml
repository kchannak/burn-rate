name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageTracker-unsigned
          path: dist/*.zip
